<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch5 — 5v5 Tactics Board</title>
<meta name="description" content="Interactive 5v5 indoor soccer / futsal tactics board: formations, phases, roster and substitutions.">
<meta name="theme-color" content="#020617">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <svg class="logo" aria-hidden="true" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="2" width="32" height="32" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <path d="M11 10H22C24.2091 10 26 11.7909 26 14C26 16.2091 24.2091 18 22 18H11V10Z" fill="#10B981"/>
    <path d="M11 18H20V26H16V22H11V18Z" fill="#34D399"/>
    <circle cx="21" cy="22" r="2.5" fill="#F8FAFC"/>
  </svg>
  <h1>Pitch<span class="five">5</span></h1>
  <span class="tagline" data-i18n="subtitle">5v5 Tactical Intelligence &amp; Board</span>
  <button class="btn" id="btnLang" type="button" style="margin-left:auto"></button>
</header>

<main>
  <section class="card" data-i18n-aria="pitchLabel" aria-label="Tactical pitch">
    <div class="pitch-wrap">
      <svg id="pitch" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid meet" role="img" data-i18n-aria="pitchAria" aria-label="Indoor soccer pitch, our team attacking up">
        <defs>
          <linearGradient id="turfGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#064E3B"/><stop offset=".5" stop-color="#022C22"/><stop offset="1" stop-color="#064E3B"/>
          </linearGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1"/></filter>
          <filter id="passGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation=".7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0 0 L6 3 L0 6 z" fill="#67E8F9"/>
          </marker>
          <marker id="runArrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse">
            <path d="M0 0 L6 3 L0 6 z" fill="#34D399"/>
          </marker>
          <clipPath id="fieldClip"><rect x="6" y="10" width="88" height="140"/></clipPath>
        </defs>
        <rect x="0" y="0" width="100" height="160" fill="#020617"/>
        <g id="turf" clip-path="url(#fieldClip)"></g>
        <g id="markings" fill="none" stroke="rgba(255,255,255,.85)" stroke-width=".6" stroke-linecap="round">
          <rect x="6" y="10" width="88" height="140"/>
          <line x1="6" y1="80" x2="94" y2="80"/>
          <circle cx="50" cy="80" r="9"/>
          <circle cx="50" cy="80" r=".8" fill="rgba(255,255,255,.85)"/>
          <path d="M32 10 A18 18 0 0 0 68 10"/>
          <path d="M32 150 A18 18 0 0 1 68 150"/>
          <circle cx="50" cy="28" r=".8" fill="rgba(255,255,255,.85)"/>
          <circle cx="50" cy="132" r=".8" fill="rgba(255,255,255,.85)"/>
          <path d="M6 12.5 A2.5 2.5 0 0 0 8.5 10"/>
          <path d="M91.5 10 A2.5 2.5 0 0 0 94 12.5"/>
          <path d="M6 147.5 A2.5 2.5 0 0 1 8.5 150"/>
          <path d="M91.5 150 A2.5 2.5 0 0 1 94 147.5"/>
          <rect x="43" y="5" width="14" height="5" stroke-width=".8"/>
          <rect x="43" y="150" width="14" height="5" stroke-width=".8"/>
        </g>
        <g id="grid" stroke="rgba(255,255,255,.18)" stroke-width=".25" style="display:none" pointer-events="none"></g>
        <g id="ghosts"></g>
        <g id="moves" fill="none" stroke="#34D399" stroke-width=".5" stroke-dasharray="1.2 1.1" stroke-linecap="round" pointer-events="none"></g>
        <g id="arrows" fill="none" stroke="#67E8F9" stroke-width=".7" stroke-linecap="round" filter="url(#passGlow)" pointer-events="none"></g>
        <g id="tokens"></g>
        <g id="ball" data-ball="1">
          <circle r="4" fill="transparent"/>
          <circle r="1.9" fill="#F8FAFC" stroke="#020617" stroke-width=".5"/>
          <path d="M-.9 -.4 L0 -1.1 L.9 -.4 L.55 .7 L-.55 .7 z" fill="#020617"/>
        </g>
      </svg>
    </div>
    <div class="controls">
      <button class="btn sheet-toggle" id="btnSheet" type="button" aria-expanded="false" aria-controls="panelSheet"></button>
      <div class="group" role="group" data-i18n-aria="phasesLabel" aria-label="Phases" id="phaseBtns"></div>
      <div class="sep"></div>
      <div class="group">
        <button class="btn primary" id="btnPlay" type="button"></button>
        <button class="btn" id="btnPause" type="button"></button>
        <button class="btn" id="btnReset" type="button"></button>
        <select class="btn" id="speed" data-i18n-aria="speed" aria-label="Playback speed">
          <option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option>
        </select>
        <button class="btn" id="btnGrid" type="button" aria-pressed="false"></button>
        <button class="btn" id="btnSnap" type="button" aria-pressed="false"></button>
      </div>
    </div>
  </section>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <aside class="card" id="panelSheet" data-i18n-aria="panelLabel" aria-label="Tactical panel">
    <button class="btn sheet-close" id="btnSheetClose" type="button" data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-formation" aria-controls="panel-formation" aria-selected="true" type="button" data-i18n="tabFormation">Formation</button>
      <button class="tab" role="tab" id="tab-roster" aria-controls="panel-roster" aria-selected="false" type="button" data-i18n="tabRoster">Roster</button>
      <button class="tab" role="tab" id="tab-guide" aria-controls="panel-guide" aria-selected="false" type="button" data-i18n="tabGuide">Phase Guide</button>
    </div>
    <div class="tabpanel" role="tabpanel" id="panel-formation" aria-labelledby="tab-formation"></div>
    <div class="tabpanel" role="tabpanel" id="panel-roster" aria-labelledby="tab-roster" hidden></div>
    <div class="tabpanel" role="tabpanel" id="panel-guide" aria-labelledby="tab-guide" hidden></div>
  </aside>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
